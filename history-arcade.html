<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f6fa; --card:#ffffff; --ink:#17203a; --muted:#566080; --line:#d8dbe7;
  --gold:#f2b632; --gold-ink:#33260a; --navy:#22315e; --navy-ink:#ffffff;
  --teal:#11735d; --teal-bg:#e1f2ec; --red:#b22f39; --red-bg:#fbe7e8;
  --focus:#2f5bd3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10152a; --card:#192040; --ink:#e8ebf6; --muted:#a0a8c4; --line:#2c3558;
    --gold:#f2b632; --gold-ink:#33260a; --navy:#3a4f96; --navy-ink:#ffffff;
    --teal:#5fd1ad; --teal-bg:#123a31; --red:#ff8a93; --red-bg:#3c1c24; --focus:#8fb0ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10152a; --card:#192040; --ink:#e8ebf6; --muted:#a0a8c4; --line:#2c3558;
  --gold:#f2b632; --gold-ink:#33260a; --navy:#3a4f96; --navy-ink:#ffffff;
  --teal:#5fd1ad; --teal-bg:#123a31; --red:#ff8a93; --red-bg:#3c1c24; --focus:#8fb0ff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:60rem;margin:0 auto;padding:1.25rem 1rem 3rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.who{display:flex;gap:.5rem;align-items:center;color:var(--muted);font-size:.95rem}
.link{background:none;border:0;padding:.25rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* Hero */
.hero h1{font-size:clamp(2.6rem,9vw,5.25rem);font-weight:800;letter-spacing:-.035em}
.hero p{max-width:36rem;color:var(--muted);margin:.75rem 0 1.5rem}
.courses{display:flex;gap:.75rem;flex-wrap:wrap}

/* Ticket stubs: the one bold element */
.stub{
  --notch:9px;
  position:relative;border:0;background:var(--gold);color:var(--gold-ink);
  padding:.85rem 1.35rem;font-weight:700;text-align:left;
  -webkit-mask:radial-gradient(circle var(--notch) at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--notch) at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle var(--notch) at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--notch) at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  border-radius:4px;transition:transform .12s ease;
}
.stub::after{content:"";position:absolute;top:8px;bottom:8px;right:2.4rem;border-left:2px dashed color-mix(in srgb,var(--gold-ink) 35%,transparent)}
.stub small{display:block;font-weight:400;font-size:.85rem;opacity:.8}
.stub .tear{display:inline-block;width:2.4rem}
.stub:hover{transform:translateY(-2px)}
.stub.off{background:var(--card);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.stub.off::after{border-left-color:var(--line)}
.stub.navy{background:var(--navy);color:var(--navy-ink)}
.stub.navy::after{border-left-color:color-mix(in srgb,var(--navy-ink) 40%,transparent)}
@media (prefers-reduced-motion:reduce){.stub{transition:none}.stub:hover{transform:none}}

/* Topic list */
.unit{margin-top:2.5rem}
.unit h2{font-size:1.6rem;font-weight:700}
.unit .sub{color:var(--muted);margin:.35rem 0 1.25rem}
.topics{display:grid;gap:.6rem}
.topic{display:grid;grid-template-columns:3.4rem 1fr auto;gap:.75rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem}
.topic .n{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.35rem;color:var(--muted)}
.topic h3{font-size:1.05rem;font-weight:700;font-family:"Atkinson Hyperlegible",system-ui,sans-serif}
.topic .meta{color:var(--muted);font-size:.9rem}
.pair{display:flex;gap:.5rem}
.pair .stub{padding:.55rem 2.9rem .55rem .9rem;font-size:.95rem}
@media (max-width:560px){.topic{grid-template-columns:2.6rem 1fr}.pair{grid-column:1/-1}.pair .stub{flex:1}}

/* Panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.4rem;max-width:40rem;margin:0 auto}
.panel h2{font-size:1.7rem;margin-bottom:.5rem}
label{display:block;font-weight:700;margin:1rem 0 .35rem}
input,select{font:inherit;width:100%;padding:.65rem .75rem;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.hint{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.25rem}
.btn{border:0;border-radius:8px;padding:.7rem 1.1rem;font-weight:700;background:var(--navy);color:var(--navy-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.err{color:var(--red);font-weight:700;margin-top:.5rem}

/* Play */
.hud{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem}
.hud .tk{font-weight:700}
.stats{display:flex;gap:1rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.pips{display:flex;gap:.35rem;margin-bottom:1rem}
.pip{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pip.ok{background:var(--teal)} .pip.no{background:var(--red)} .pip.now{background:var(--gold)}
.q{font-size:1.3rem;font-weight:700;margin:.25rem 0 1rem;max-width:44rem}
.kind{color:var(--muted);font-size:.9rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:.75rem .9rem}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt.right{border-color:var(--teal);background:var(--teal-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt[disabled]{cursor:default}
.sortrow{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;border:2px solid var(--line);border-radius:10px;padding:.5rem .6rem;background:var(--paper)}
.sortrow.right{border-color:var(--teal);background:var(--teal-bg)}
.sortrow.wrong{border-color:var(--red);background:var(--red-bg)}
.seg{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .7rem;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.seqcols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:640px){.seqcols{grid-template-columns:1fr}}
.seqcols h4{margin:0 0 .4rem;font-size:.95rem;color:var(--muted)}
.slot{display:flex;gap:.6rem;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:.6rem .75rem;margin-bottom:.4rem}
.slot .num{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;min-width:1.2rem}
.slot.right{border-color:var(--teal);background:var(--teal-bg)}
.slot.wrong{border-color:var(--red);background:var(--red-bg)}
.empty{color:var(--muted);font-style:italic;padding:.5rem 0}
.fb{margin-top:1rem;border-radius:10px;padding:.9rem 1rem}
.fb.ok{background:var(--teal-bg)} .fb.no{background:var(--red-bg)}
.fb strong{display:block;margin-bottom:.2rem}
.fb .ans{margin:.35rem 0 0}

/* Results */
.result{text-align:center}
.bigstub{display:inline-block;padding:1.2rem 4rem 1.2rem 1.6rem;cursor:default;margin:1rem 0}
.bigstub:hover{transform:none}
.bigstub .score{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:3rem;font-weight:800;line-height:1}
.code{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:.08em}
.review{text-align:left;margin-top:1.25rem}
.review li{margin-bottom:.75rem}
.note{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:.8rem 1rem;margin-top:1rem;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{color:var(--muted);font-size:.85rem;margin-top:3rem}
</style>
</head>

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const normName = n => n.trim().replace(/\s+/g," ").toUpperCase();
function checkCode(name, ticket, got){
  const k = normName(name)+"|"+ticket; let s = 0;
  for (let i=0;i<k.length;i++) s += k.charCodeAt(i)*(i+1);
  return (s + got*97 + 4271) % 9973;
}

let student = store.get("arcade-student");
let courseKey = location.hash === "#euro" ? "euro" : "world";
let game = null, tick = null, pending = null;

function renderWho(){
  $("#who").innerHTML = student
    ? `${esc(student.name)}, period ${esc(student.period)} <button class="link" id="chg">Change</button>`
    : "";
  const b = $("#chg"); if (b) b.onclick = () => signIn(null);
}

/* ===== Home ===== */

  const c = COURSES[courseKey];
  app.innerHTML = `

    </div>
  </section>
  <section class="unit">

    <p class="sub">Entry tickets review earlier topics. Exit tickets check today’s topic.</p>
    <div class="topics">
      ${c.topics.map((tp,i)=>`
        <div class="topic">
          <span class="n">${tp.n}</span>

          <div class="pair">

            <button class="stub" data-play="${i}" data-kind="exit">Exit</button>
          </div>
        </div>`).join("")}
    </div>
  </section>`;

/* ===== Sign in ===== */
function signIn(req){
  clearInterval(tick);
  pending = req;
  app.innerHTML = `
  <div class="panel">
    <h2>Who’s playing?</h2>
    <p class="hint">Use the name your teacher knows you by. It goes on your score.</p>
    <label for="nm">Full name</label>
    <input id="nm" autocomplete="name" value="${student?esc(student.name):""}">
    <label for="pd">Class period</label>
    <select id="pd"><option value="">Choose your period</option>${PERIODS.map(p=>`<option ${student&&student.period===p?"selected":""}>${p}</option>`).join("")}</select>
    <div class="err" id="er" role="alert"></div>
    <div class="row"><button class="btn" id="go">${req?"Start ticket":"Save"}</button><button class="btn ghost" id="bk">Back</button></div>
  </div>`;
  $("#nm").focus();
  $("#go").onclick = () => {
    const name=$("#nm").value.trim(), period=$("#pd").value;
    if (name.split(/\s+/).length<2){ $("#er").textContent="Enter your first and last name."; return; }
    if (!period){ $("#er").textContent="Choose your class period."; return; }
    student={name,period}; store.set("arcade-student",student); renderWho();
    pending ? start(pending) : home();
  };
  $("#bk").onclick = home;
}

/* ===== Game ===== */
function start({topic,kind}){
  const c = COURSES[courseKey], tp = c.topics[topic];
  let items;
  if (kind==="exit") items = shuffle(tp.items);
  else if (topic===0) items = shuffle(tp.items).slice(0,3);
  else items = shuffle(c.topics.slice(0,topic).flatMap(t=>t.items)).slice(0,4);
  game = { c, tp, kind, ticket:`${c.code}${tp.n}-${kind.toUpperCase()}`, items, i:0, results:[], points:0, streak:0, t0:Date.now(), qt:Date.now() };
  clearInterval(tick); tick = setInterval(updClock, 1000);
  question();
}
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function updClock(){ const el=$("#clk"); if(el&&game) el.textContent = fmt(Math.floor((Date.now()-game.t0)/1000)); }

function hud(){
  const g=game;
  return `<div class="hud">
    <span class="tk">${esc(g.tp.n)} ${g.kind==="entry"?"Entry":"Exit"} ticket</span>
    <span class="stats"><span>Question <b>${g.i+1}</b> of ${g.items.length}</span><span><b id="clk">${fmt(Math.floor((Date.now()-g.t0)/1000))}</b></span><span><b>${g.points}</b> pts</span></span>
  </div>
  <div class="pips" aria-hidden="true">${g.items.map((_,k)=>`<span class="pip ${k<g.results.length?(g.results[k].ok?"ok":"no"):(k===g.i?"now":"")}"></span>`).join("")}</div>`;
}

function question(){
  const g=game, it=g.items[g.i]; g.qt=Date.now();
  let body="", kindLabel="";
  if (it[0]==="mc"){
    kindLabel="Pick one";
    const order = shuffle(it[2].map((o,k)=>k));
    body = `<div class="opts">${order.map(k=>`<button class="opt" data-k="${k}">${esc(it[2][k])}</button>`).join("")}</div>`;
  } else if (it[0]==="sort"){
    kindLabel="Sort every item, then check";
    const rows = shuffle(it[3].map((r,k)=>k));
    body = `<div class="opts">${rows.map(k=>`<div class="sortrow" data-r="${k}"><span>${esc(it[3][k][0])}</span><span class="seg" role="group" aria-label="${esc(it[3][k][0])}">${it[2].map((cat,ci)=>`<button data-c="${ci}" aria-pressed="false">${esc(cat)}</button>`).join("")}</span></div>`).join("")}</div>
      <div class="row"><button class="btn" id="chk" disabled>Check</button></div>`;
  } else {
    kindLabel="Tap the items in order";
    g.seqPool = shuffle(it[2].map((x,k)=>k)); g.seqPick=[];
    body = `<div class="seqcols"><div><h4>Events</h4><div id="pool"></div></div><div><h4>Your order</h4><div id="pick"></div></div></div>
      <div class="row"><button class="btn" id="chk" disabled>Check</button><button class="btn ghost" id="clr">Clear</button></div>`;
  }
  app.innerHTML = `<div class="panel" style="max-width:48rem">${hud()}<div class="kind">${kindLabel}</div><p class="q">${esc(it[1])}</p>${body}<div id="fb"></div></div>`;

  if (it[0]==="mc"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===it[3];
      app.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===it[3]) x.classList.add("right"); });
      if(!ok) b.classList.add("wrong");
      finish(ok, ok?"":`Correct answer: ${it[2][it[3]]}`);
    });
  } else if (it[0]==="sort"){
    const picks={};
    app.querySelectorAll(".sortrow").forEach(row=>{
      row.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
        picks[row.dataset.r]=+btn.dataset.c;
        row.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===btn));
        $("#chk").disabled = Object.keys(picks).length<it[3].length;
      });
    });
    $("#chk").onclick=()=>{
      let ok=true;
      app.querySelectorAll(".sortrow").forEach(row=>{
        const r=+row.dataset.r, good=picks[r]===it[3][r][1]; if(!good) ok=false;
        row.classList.add(good?"right":"wrong"); row.querySelectorAll("button").forEach(x=>x.disabled=true);
      });
      $("#chk").remove();
      const key = it[2].map((cat,ci)=>`${cat}: ${it[3].filter(r=>r[1]===ci).map(r=>r[0]).join(", ")}`).join(". ");
      finish(ok, ok?"":key+".");
    };
  } else {
    const draw=()=>{
      $("#pool").innerHTML = g.seqPool.length ? g.seqPool.map(k=>`<button class="slot" data-k="${k}"><span>${esc(it[2][k])}</span></button>`).join("") : `<div class="empty">All placed.</div>`;
      $("#pick").innerHTML = g.seqPick.length ? g.seqPick.map((k,n)=>`<button class="slot" data-k="${k}" aria-label="Remove ${esc(it[2][k])}"><span class="num">${n+1}</span><span>${esc(it[2][k])}</span></button>`).join("") : `<div class="empty">Tap an event to place it first.</div>`;
      $("#pool").querySelectorAll(".slot").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; g.seqPool=g.seqPool.filter(x=>x!==k); g.seqPick.push(k); draw(); });
      $("#pick").querySelectorAll(".slot").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; g.seqPick=g.seqPick.filter(x=>x!==k); g.seqPool.push(k); draw(); });
      $("#chk").disabled = g.seqPool.length>0;
    };
    draw();
    $("#clr").onclick=()=>{ g.seqPool=shuffle(it[2].map((x,k)=>k)); g.seqPick=[]; draw(); };
    $("#chk").onclick=()=>{
      const ok = g.seqPick.every((k,n)=>k===n);
      $("#pick").querySelectorAll(".slot").forEach((b,n)=>{ b.disabled=true; b.classList.add(+b.dataset.k===n?"right":"wrong"); });
      $("#chk").remove(); $("#clr").remove();
      finish(ok, ok?"":`Correct order: ${it[2].join(" → ")}`);
    };
  }
}

function finish(ok, answer){
  const g=game, it=g.items[g.i], secs=(Date.now()-g.qt)/1000;
  if (ok){ g.streak++; g.points += 100 + Math.max(0, Math.round(60-4*secs)) + (g.streak>=3?50:0); } else g.streak=0;
  g.results.push({id:it.id, ok});
  const last = g.i===g.items.length-1;
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><strong>${ok?(g.streak>=3?`Correct. Streak of ${g.streak}.`:"Correct."):"Not quite."}</strong>${answer?`<p class="ans">${esc(answer)}</p>`:""}<p class="ans">${esc(it[it[0]==="mc"?4:(it[0]==="sort"?4:3)])}</p></div>
    <div class="row"><button class="btn" id="nx">${last?"See my score":"Next question"}</button></div>`;
  app.querySelector(".pips").innerHTML = g.items.map((_,k)=>`<span class="pip ${k<g.results.length?(g.results[k].ok?"ok":"no"):""}"></span>`).join("");
  const pts=app.querySelectorAll(".stats b")[2]; if(pts) pts.textContent=g.points;
  $("#nx").focus();
  $("#nx").onclick=()=>{ if(last) results(); else { g.i++; question(); } };
}

/* ===== Results ===== */
function results(){
  clearInterval(tick);
  const g=game, got=g.results.filter(r=>r.ok).length, total=g.items.length;
  const missed = g.results.filter(r=>!r.ok).map(r=>r.id);
  const code = String(checkCode(student.name, g.ticket, got)).padStart(4,"0");
  const score = `${got} of ${total}`;
  const secs = Math.floor((Date.now()-g.t0)/1000);
  let send;
  if (FORM.url){
    const p = new URLSearchParams({usp:"pp_url"});
    p.set(FORM.f.name, student.name); p.set(FORM.f.period, student.period); p.set(FORM.f.ticket, g.ticket);
    p.set(FORM.f.score, score); p.set(FORM.f.missed, missed.length?missed.join(", "):"None"); p.set(FORM.f.code, code);
    send = `<a class="stub" style="text-decoration:none;padding-right:3.2rem" href="${esc(FORM.url+"?"+p.toString())}" target="_blank" rel="noopener">Send to teacher<small>Opens the form. Press Submit.</small></a>`;
  } else {
    send = `<div class="note"><strong>Score sending isn’t connected yet.</strong> Show this screen to your teacher or take a screenshot.</div>`;
  }
  const missedItems = g.items.filter(it=>missed.includes(it.id));
  app.innerHTML = `
  <div class="panel result">
    <h2>${esc(g.tp.n)} ${g.kind==="entry"?"Entry":"Exit"} ticket done</h2>
    <div class="stub bigstub" role="img" aria-label="${score} correct"><span class="score">${score}</span><small>${g.points} points in ${fmt(secs)}</small></div>
    <p class="hint">Ticket ${esc(g.ticket)} for ${esc(student.name)}, period ${esc(student.period)}</p>
    <p>Check code <span class="code">${code}</span></p>
    ${send}
    ${missedItems.length?`<div class="review"><h3>Review what you missed</h3><ul>${missedItems.map(it=>`<li><strong>${esc(it[1])}</strong><br>${esc(it[0]==="mc"?it[2][it[3]]:it[0]==="seq"?it[2].join(" → "):it[2].map((cat,ci)=>`${cat}: ${it[3].filter(r=>r[1]===ci).map(r=>r[0]).join(", ")}`).join(". "))}</li>`).join("")}</ul></div>`:`<p>Clean sweep. Nothing to review.</p>`}
    <div class="row" style="justify-content:center"><button class="btn ghost" id="again">Play again</button><button class="btn" id="menu">All tickets</button></div>
  </div>`;
  $("#again").onclick=()=>start({topic:g.c.topics.indexOf(g.tp), kind:g.kind});
  $("#menu").onclick=home;
}

renderWho(); home();
</script>
</body>
</html>
